/* Layout: one full-screen "stage" for the student (huge targets, stable positions) and a calm document-like adult zone. */
:root {
  --bg: #eaf0f4;          /* cool paper, slight blue bias */
  --surface: #ffffff;
  --ink: #17293a;
  --muted: #546474;
  --line: #c9d5de;
  --accent: #0a6c8f;      /* sea blue: buttons and links */
  --accent-ink: #ffffff;
  --focus: #f0a400;       /* scanning / focus ring: high-visibility amber */
  --focus-soft: #ffe7a8;
  --ok: #2c7a3f;
  --ok-soft: #d8f0dd;
  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --font-learn: "Andika", "Atkinson Hyperlegible", "Verdana", sans-serif;
  --font-ui: "Atkinson Hyperlegible", "Verdana", "Segoe UI", sans-serif;
  --tile: 9.5rem;         /* answer tile size; changed by presentation profile */
  --radius: 18px;
  color-scheme: light;
}


html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }
.screen { min-height: 100%; }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 14px; align-content: start; }
.stack > p { margin: 0; }
.btn { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 700; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 10px; min-height: 36px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--warn); border-color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
label.f { display: grid; gap: 4px; align-content: start; font-weight: 700; font-size: 14px; }
label.f span.h { font-weight: 400; color: var(--muted); font-size: 13px; }
input[type=text], input[type=password], input[type=number], input[type=url], select, textarea {
  font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; width: 100%;
}
textarea { min-height: 140px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--focus-soft); color: var(--ink); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.note { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.grid2 { align-items: start; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }

/* ---------- profile picker / welcome ---------- */
.brand { font-family: var(--font-learn); font-size: 2.1rem; font-weight: 700; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--font-ui); font-size: 1rem; font-weight: 400; color: var(--muted); }
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.pcard { display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px 10px; cursor: pointer; }
.pcard .av { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 46px; background: var(--bg); overflow: hidden; }
.pcard .av img { width: 100%; height: 100%; object-fit: cover; }
.pcard b { font-family: var(--font-learn); font-size: 1.3rem; }

/* ---------- student stage ---------- */
.stage { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.stage-main { display: grid; align-content: center; justify-items: center; gap: 22px; min-height: 0; overflow: auto; padding-block: 8px; }
.prompt { font-family: var(--font-learn); font-size: clamp(1.3rem, 3.6vw, 2rem); text-align: center; max-width: 30ch; }
.stimulus { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
.stim-word { font-family: var(--font-learn); font-size: clamp(3rem, 12vw, 6.5rem); line-height: 1; letter-spacing: .04em; background: var(--surface); border-radius: var(--radius); padding: 14px 28px; border: 2px solid var(--line); }
.stim-word .g { display: inline-block; border-radius: 10px; padding: 0 .04em; transition: background .2s; }
.stim-word .g.lit { background: var(--focus-soft); }
.stim-pic { font-size: calc(var(--tile) * .62); line-height: 1; background: var(--surface); border-radius: var(--radius); width: calc(var(--tile) * 1.15); height: calc(var(--tile) * 1.15); display: grid; place-items: center; border: 2px solid var(--line); overflow: hidden; }
.stim-pic img { width: 100%; height: 100%; object-fit: cover; }
.answers { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.tile { width: var(--tile); height: var(--tile); max-width: 42vw; max-height: 42vw; border-radius: var(--radius); border: 3px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; position: relative; padding: 0; overflow: hidden; }
.tile .pic { font-size: calc(var(--tile) * .58); line-height: 1; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .let { font-family: var(--font-learn); font-size: calc(var(--tile) * .55); line-height: 1; }
.tile .wrd { font-family: var(--font-learn); font-size: calc(var(--tile) * .26); }
.tile.yes, .tile.no { width: calc(var(--tile) * 1.1); }
.tile .lbl { font-family: var(--font-learn); font-size: calc(var(--tile) * .2); font-weight: 700; }
.tile.dim { opacity: .18; pointer-events: none; }
.tile.hint { border-color: var(--focus); box-shadow: 0 0 0 6px var(--focus-soft); }
.tile.right { border-color: var(--ok); box-shadow: 0 0 0 8px var(--ok-soft); }
.tile.model { animation: pulse 0.9s ease-in-out 2; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.focused { outline: 6px solid var(--focus) !important; outline-offset: 4px; box-shadow: 0 0 0 14px var(--focus-soft) !important; transform: scale(1.05); z-index: 2; }
.group-focused { outline: 5px dashed var(--focus); outline-offset: 6px; border-radius: 16px; }
.dwell-ring { position: absolute; inset: 6px; border-radius: 14px; pointer-events: none; background: conic-gradient(var(--focus) calc(var(--p, 0) * 1turn), transparent 0); opacity: .35; }
.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding-top: 8px; border-top: 2px solid var(--line); }
.ctl { min-width: 7.5rem; min-height: 4.2rem; border-radius: 16px; border: 3px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--font-learn); font-size: 1.15rem; display: grid; justify-items: center; align-content: center; gap: 2px; padding: 6px 12px; position: relative; }
.ctl .i { font-size: 1.6rem; line-height: 1; }
.corner { position: fixed; top: 0; right: 0; width: 72px; height: 72px; z-index: 50; touch-action: none; }
.corner .fill { position: absolute; inset: 10px; border-radius: 50%; background: conic-gradient(var(--muted) calc(var(--p, 0) * 1turn), transparent 0); opacity: .5; }
.big-start { font-family: var(--font-learn); font-size: clamp(2rem, 7vw, 3.4rem); padding: 26px 56px; border-radius: 28px; border: 4px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; position: relative; }
.guide { font-size: 4.5rem; line-height: 1; }
.speech { font-family: var(--font-learn); font-size: 1.4rem; background: var(--surface); padding: 10px 18px; border-radius: 18px; border: 2px solid var(--line); max-width: 34ch; text-align: center; }
.kbd { display: grid; gap: 10px; justify-items: center; }
.kbd .krow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.key { min-width: calc(var(--tile) * .58); height: calc(var(--tile) * .62); border-radius: 14px; border: 3px solid var(--line); background: var(--surface); font-family: var(--font-learn); font-size: calc(var(--tile) * .34); cursor: pointer; position: relative; padding: 0 10px; }
.key.fn { font-size: 1.05rem; min-width: calc(var(--tile) * .9); }
.slots { display: flex; gap: 8px; min-height: calc(var(--tile) * .7); align-items: end; flex-wrap: wrap; justify-content: center; }
.slot { min-width: calc(var(--tile) * .5); height: calc(var(--tile) * .66); border-bottom: 5px solid var(--ink); font-family: var(--font-learn); font-size: calc(var(--tile) * .5); text-align: center; line-height: 1.2; }
.msgline { font-family: var(--font-learn); font-size: 2rem; min-height: 3rem; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 6px 14px; width: min(90vw, 760px); overflow-wrap: anywhere; }
.dict { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dict .key { font-size: 1.4rem; }
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: grid; place-items: center; z-index: 40; padding: 16px; }
.reward { display: grid; gap: 18px; justify-items: center; text-align: center; }
.reward .words { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.reward .words span { font-family: var(--font-learn); font-size: 1.5rem; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 4px 12px; }
.bubble-help { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--warn-soft); color: var(--ink); padding: 8px 16px; border-radius: 99px; font-weight: 700; z-index: 45; }

/* ---------- adult zone ---------- */
.adult header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.adult h1 { font-size: 1.6rem; }
.adult h2 { font-size: 1.2rem; margin-bottom: 8px; }
.home-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.home-btn { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; text-align: left; cursor: pointer; display: grid; gap: 4px; min-height: 110px; }
.home-btn b { font-size: 1.15rem; }
.home-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.letters { display: flex; gap: 6px; flex-wrap: wrap; }
.letters label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; font-family: var(--font-learn); font-size: 1.15rem; background: var(--bg); }
.wordgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.wcell { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: grid; grid-template-columns: 44px 1fr; gap: 6px; align-items: center; background: var(--bg); font-size: 13px; }
.wcell .wp { font-size: 30px; width: 44px; height: 44px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; }
.wcell .wp img { width: 100%; height: 100%; object-fit: cover; }
.wcell b { font-family: var(--font-learn); font-size: 1.05rem; font-weight: 700; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--line); }
.chart .crit { stroke: var(--warn); stroke-dasharray: 5 4; }
.chart .ln { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.chart .pt { fill: var(--accent); }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
.modal { background: var(--surface); border-radius: 18px; padding: 20px; width: min(440px, 100%); display: grid; gap: 12px; border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .focused { transform: none; } }

/* One light palette across the app, including native fields and all dialogs. */
:root{color-scheme:light;--bg:#f4f8f6;--surface:#fff;--ink:#203e42;--muted:#4e6863;--line:#bfd1c8;--accent:#17676b;--accent-ink:#fff;--focus:#9a6300;--focus-soft:#fff0cc;--ok:#24674e;--ok-soft:#e2f3e8;--warn:#835117;--warn-soft:#fff0d9;--mint:#e3efeb;--shadow:0 12px 36px #254b3a0d,0 2px 6px #254b3a08}
body,body.workspace-theme{background:#f4f8f6;background-image:none;color:var(--ink)}
body::before,body::after{display:none!important}
.institutional-header,.workspace-theme .institutional-header{background:#fff;border-color:var(--line);color:var(--ink)}
.institutional-header .utac-black{display:block!important;filter:none!important}
.institutional-header .utac-white{display:none!important}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea,
.workspace-theme input,.workspace-theme select,.workspace-theme textarea{color:#203e42;background:#fff;border-color:#a6beb2;color-scheme:light;-webkit-text-fill-color:#203e42}
select option,select optgroup{color:#203e42;background:#fff}
input::placeholder,textarea::placeholder{color:#536c66;opacity:1;-webkit-text-fill-color:#536c66}
button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:1;color:#4e6560!important;-webkit-text-fill-color:#4e6560;background-color:#edf2ef!important;border-color:#a6beb2;cursor:default}
button:disabled>*{opacity:1}
.redesigned-guide-options[aria-disabled=true]{opacity:1}
.redesigned-guide-options[aria-disabled=true] img{opacity:.65}
.guide-mode-options button{color:#4e6863}
.workspace-theme .muted,.workspace-theme .f>small,.setting-description,.setting-footnote,
.settings-card-heading p,.section-heading>p,.profile-card-meta,.profile-create>span:last-child,
.workspace-profile p,.session-card-bottom>span,.dashboard-link small,.workspace-theme .page-footer{color:#4e6863}
.workspace-theme .tabs button{color:#4e6863}
.workspace-theme .tabs button[aria-selected=true]{color:#17615e;background:#fff}
.workspace-theme button:focus-visible,.workspace-theme a:focus-visible,.workspace-theme input:focus-visible,.workspace-theme select:focus-visible{outline-color:#9a6300}
.overlay{background:rgba(237,245,240,.97);color:#203e42;overscroll-behavior:contain}
.modal,.reward{background:#fff;color:#203e42;border:1px solid #bfd1c8;border-radius:24px;box-shadow:0 18px 55px #254b3a14}
.modal{gap:16px;padding:28px;max-height:calc(100dvh - var(--institutional-height) - 32px);overflow-y:auto}
.modal h2{font-size:1.35rem;letter-spacing:-.025em}
.modal p,.modal small,.modal label,.modal .f span.h{color:inherit}
.modal .muted,.modal .font-licenses{color:#4e6863}
.modal .btn{box-shadow:none;min-height:44px;border-radius:11px}
.credits-modal{width:min(740px,calc(100vw - 32px));max-width:740px;padding:30px}
.credits-modal .credits-heading{border-bottom:1px solid #d7e4dc;padding-bottom:18px}
.credits-modal section{background:#f4f8f6;border:1px solid #dce7e0;border-radius:15px;padding:18px;gap:9px}
.credits-modal h3{color:#244d4b}
.credits-modal p{line-height:1.7}
.credits-modal a{color:#175e63;text-decoration-thickness:1px;text-underline-offset:3px}
/* Guide containers retain their animation hooks, without a drawn bubble. */
.guide-bubble{padding:0!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.guide-bubble .guide-img,.guide-bubble .guide-video{background:transparent!important;border-radius:0!important;box-shadow:none!important}
.stage.welcome{background:#f4f8f6;background-image:none}
.stage.welcome::before{display:block;content:'';background-image:var(--classroom-image);background-size:cover;background-position:center;opacity:.20}
.stage:has(.reward)::before{display:none;background-image:none;content:none}
.stage.welcome .mentor{background:#fff;color:#203e42;border:1px solid #bfd1c8;border-radius:24px;box-shadow:0 12px 36px #254b3a12;padding:24px 32px;gap:24px}
.stage.welcome .speech{background:none;border:0;color:#203e42;font-size:clamp(1.4rem,3vw,1.8rem);padding:0;max-width:28ch}
.stage.welcome .guide-bubble{--bubble-size:210px}
.stage.welcome .guide-bubble .guide-img,.stage.welcome .guide-bubble .guide-video{object-fit:contain!important}
.big-start{background:#17676b;color:#fff;border:2px solid #17676b;box-shadow:0 5px 14px #145d6420;border-radius:20px}
.big-start.is-pressed{background:#10575d}
.reward .speech{border:0;background:none;color:#203e42}
.bubble-help{background:#fff0cc;color:#4a3b18;border:1px solid #c09c4b}

.btn.is-pressed:not(.ghost):not(.danger){background-color:#10575d;color:#fff}

.start-session-card>p{color:#4e6863}
.nav-chevron{color:#536e64}
/* Letter case changes the assessed text only; prompts and controls keep their format. */
.stage[data-letter-case=lower]{--exercise-transform:lowercase}
.stage[data-letter-case=upper]{--exercise-transform:uppercase}
.stage[data-letter-case] .stim-word,
.stage[data-letter-case] .tile .let,
.stage[data-letter-case] .tile .wrd,
.stage[data-letter-case] .slot,
.stage[data-letter-case] .kbd .key:not(.fn){text-transform:var(--exercise-transform,lowercase)}
.slot.lit{background:var(--focus-soft);border-bottom-color:var(--focus);border-radius:6px;outline:3px solid var(--focus);outline-offset:3px}

        clearTimeout(timer);supportBusy=true;

        const token=Voice.token;typedReadingToken=token;

      }, "Escolta el que he escrit"),

    bindStage(c => Voice.say(c, { volume: 0.7 }),{suspend:true});
    async function present(){

          if(!done&&S===presentationSession&&!S.ended&&!S.paused){initialPresentation=false;t0=Date.now();Access.resumePresentation();schedule();}

/* Profiles and custom media stay on this device. No server-side account exists. */
const LocalBackups={
 clean(value){return JSON.parse(JSON.stringify(value),(k,v)=>{if(['__proto__','prototype','constructor'].includes(k))throw Error('La còpia conté camps no admesos.');return v;});},
 profile(value){
  if(!value||typeof value!=='object'||Array.isArray(value)||typeof value.name!=='string'||!value.name.trim()||!value.plan||!Array.isArray(value.plan.learned)||!value.pres||typeof value.pres!=='object'||Array.isArray(value.pres)||!value.access||typeof value.access!=='object'||Array.isArray(value.access)||!Array.isArray(value.log)||!Array.isArray(value.sessions)||(value.pwHash!=null&&typeof value.pwHash!=='string'))throw Error('El fitxer no conté perfils vàlids de LECAA.');
  const p=this.clean(value),base=newProfile(p.name.trim(),p.avatar,p.pwHash||null);
  const out={...base,...p,name:p.name.trim(),access:{...base.access,...p.access},pres:{...base.pres,...p.pres},plan:{...base.plan,...p.plan},state:{...base.state,...p.state},changes:Array.isArray(p.changes)?p.changes:[]};
  if(!Array.isArray(out.plan.excluded))out.plan.excluded=[];
  if(!out.state.known||!Array.isArray(out.state.known.read)||!Array.isArray(out.state.known.write))out.state.known={read:[],write:[]};
  if(!AVATARS.includes(out.avatar))out.avatar=AVATARS[0];
  if(!GUIDES.some(g=>g[0]===out.pres.guide))out.pres.guide=GUIDES[0][0];
  if(!['contour','matte','arasaac'].includes(out.pres.imageStyle))out.pres.imageStyle='contour';
  out.pres.letterCase=exerciseLetterCase(out);normalizeActivities(out);return out;
 },
 blob(key,url){
  if(typeof key!=='string'||!/^(img:|rec:)/.test(key)||key.includes('|')||typeof url!=='string')throw Error('Hi ha un material no vàlid a la còpia.');
  const m=/^data:([^;,]*)([^,]*),([\s\S]*)$/.exec(url);
  if(!m)throw Error('La còpia només pot contenir imatges i àudios incorporats al fitxer.');
  const type=(m[1]||'application/octet-stream').toLowerCase();
  if(!(key.startsWith('img:')?/^image\//.test(type):/^audio\//.test(type))&&type!=='application/octet-stream')throw Error('El tipus d’un material no és vàlid.');
  try{if(/;base64(?:;|$)/i.test(m[2])){const raw=atob(m[3]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type});}return new Blob([decodeURIComponent(m[3])],{type});}catch(e){throw Error('Un dels materials de la còpia està mal codificat.');}
 },
 read(data){
  data=this.clean(data);
  let rows;
  if(data?.lecaa===3&&Array.isArray(data.profiles))rows=data.profiles;
  else if((data?.lecaa===1||data?.lecaa===2)&&data.profile)rows=[{profile:data.profile,media:data.media||{}}];
  else throw Error('Aquest fitxer no és una còpia de seguretat de LECAA compatible.');
  if(!rows.length)throw Error('La còpia no conté cap perfil.');
  return rows.map(row=>{const profile=this.profile(row.profile),media=row.media??{};if(!media||typeof media!=='object'||Array.isArray(media))throw Error('Els materials de la còpia no són vàlids.');const blobs=Object.entries(media).map(([key,url])=>[key,this.blob(key,url)]);return {profile,blobs};});
 },
 async create(ids){
  const snapshots=ids.map(id=>{const p=Store.data.profiles[id];if(!p)throw Error('Un perfil ja no és al dispositiu.');return this.clean(p);});
  if(!snapshots.length)throw Error('No hi ha perfils per exportar.');
  const rows=[];for(const profile of snapshots)rows.push({profile,media:await Media.exportProfile(profile.id)});
  const meta={createdAt:new Date().toISOString(),appRevision:41};
  return rows.length===1?{lecaa:2,...meta,...rows[0]}:{lecaa:3,...meta,profiles:rows};
 },
 async export(ids){
  const data=await this.create(ids),single=ids.length===1;
  const label=single?Store.data.profiles[ids[0]].name.replace(/[^\p{L}\p{N}_-]/gu,'-'):'tots-els-perfils';
  downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'LECAA-'+label+'-'+new Date().toISOString().slice(0,10)+'.json');return ids.length;
 },
 mediaTransaction(rows,remove=false){
  const entries=rows.flatMap(row=>row.blobs.map(([key,blob])=>({key:row.profile.id+'|'+key,blob})));
  if(!entries.length)return Promise.resolve();
  return new Promise((resolve,reject)=>{
   if(!Media.db)return reject(Error('Aquest navegador no permet desar els materials. No s’ha importat cap perfil.'));
   try{const tx=Media.db.transaction('m','readwrite'),st=tx.objectStore('m');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(Error('No s’han pogut desar els materials. Comprova l’espai disponible.'));tx.onabort=()=>reject(Error('La importació dels materials s’ha interromput.'));for(const e of entries)remove?st.delete(e.key):st.put(e.blob,e.key);}catch(e){reject(e);}
  });
 },
 async restore(rows){
  const names=new Set(profiles().map(p=>p.name.toLocaleLowerCase('ca'))),prepared=[];
  for(const row of rows){const p=this.profile(row.profile),original=p.name;let n=1;while(names.has(p.name.toLocaleLowerCase('ca')))p.name=original+(n++===1?' (còpia)':' (còpia '+(n-1)+')');names.add(p.name.toLocaleLowerCase('ca'));p.id=uid();while(Store.data.profiles[p.id]||prepared.some(r=>r.profile.id===p.id))p.id=uid();logChange(p,'Perfil importat d’una còpia de seguretat.');prepared.push({profile:p,blobs:row.blobs});}
  await this.mediaTransaction(prepared);
  const next={...Store.data,profiles:{...Store.data.profiles}};for(const {profile}of prepared)next.profiles[profile.id]=profile;
  try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){await this.mediaTransaction(prepared,true).catch(()=>{});throw Error('No hi ha prou espai o el navegador no permet desar els perfils. No s’ha importat cap perfil.');}
  Store.data=next;Store.ok=true;return prepared.map(r=>r.profile);
 }
};
// A read failure must not be reported as a successful, complete backup.
Media.exportProfile=function(pid){return new Promise((resolve,reject)=>{
 if(!this.db)return reject(Error('No es poden llegir els materials d’aquest navegador.'));
 const out={},pending=[];
 try{const tx=this.db.transaction('m','readonly'),r=tx.objectStore('m').openCursor();
  tx.onerror=()=>reject(Error('No s’han pogut llegir els materials.'));tx.onabort=()=>reject(Error('La lectura dels materials s’ha interromput.'));
  tx.oncomplete=()=>Promise.all(pending).then(()=>resolve(out),reject);
  r.onerror=()=>reject(Error('No s’han pogut llegir els materials.'));
  r.onsuccess=()=>{const cursor=r.result;if(!cursor)return;if(String(cursor.key).startsWith(pid+'|')){const key=String(cursor.key).slice(pid.length+1),blob=cursor.value;pending.push(new Promise((done,fail)=>{const fr=new FileReader();fr.onload=()=>{out[key]=fr.result;done();};fr.onerror=()=>fail(Error('No s’ha pogut llegir un dels materials.'));fr.readAsDataURL(blob);}));}cursor.continue();};
 }catch(e){reject(e);}
});};

 const file=h('input',{type:'file',accept:'.json,application/json',hidden:true,'data-backup-file':'','aria-label':'Tria una còpia de seguretat de LECAA'}),preview=h('div',{class:'backup-preview','aria-live':'polite'}),restore=h('button',{class:'btn',type:'button',disabled:true,'data-backup-import':''},'Importa els perfils');
 const choose=h('button',{type:'button',class:'btn ghost'},'Tria el fitxer de còpia'),fileName=h('span',{class:'backup-file-name'},'Cap fitxer triat');choose.onclick=()=>{file.value='';file.click();};
 file.onchange=async()=>{pending=null;restore.disabled=true;preview.replaceChildren();const f=file.files[0];fileName.textContent=f?.name||'Cap fitxer triat';if(!f)return;status.textContent='Llegint el fitxer…';try{pending=LocalBackups.read(JSON.parse(await f.text()));preview.append(h('p',{},pending.length===1?'S’importarà aquest perfil:':'S’importaran '+pending.length+' perfils:'),h('ul',{},...pending.map(r=>h('li',{},r.profile.name))));restore.disabled=false;status.textContent='Còpia preparada. S’afegiran perfils nous i es conservaran els que ja hi ha. Els noms repetits es distingiran amb «còpia».';}catch(e){status.textContent=e.message||'El fitxer no és una còpia vàlida.';}};
 restore.onclick=async()=>{if(!pending)return;restore.disabled=true;file.disabled=true;dialog.setBusy(true);status.textContent='Important els perfils al dispositiu…';try{const result=await LocalBackups.restore(pending);imported=true;pending=null;preview.replaceChildren(h('ul',{},...result.map(p=>h('li',{},p.name))));status.textContent='Importació completada: '+result.length+(result.length===1?' perfil afegit.':' perfils afegits.');}catch(e){status.textContent=e.message||'No s’ha pogut completar la importació.';restore.disabled=false;}finally{file.disabled=false;dialog.setBusy(false);}};
 dialog.body.append(localPrivacyNote(),h('section',{class:'backup-section stack'},h('h3',{},'Exporta'),h('p',{},'Descarrega un arxiu amb els perfils triats, la configuració, el progrés i les fotografies i els àudios personalitzats.'),field('Perfils que vols copiar',select),exp),h('section',{class:'backup-section stack'},h('h3',{},'Importa'),h('p',{},'En l’altre dispositiu, obre aquest apartat, tria el fitxer i importa els perfils. També s’accepten les còpies individuals de versions anteriors.'),h('div',{class:'row'},choose,fileName),file,preview,restore),status,h('p',{class:'muted backup-file-note'},'El fitxer descarregat conté dades personals. Desa’l en un lloc privat. Si esborres les dades del navegador, necessitaràs una còpia per recuperar els perfils.'));

const GUIDE_DOCUMENT={"about":["Lectura i Escriptura per a usuaris de Comunicació Augmentativa i Alternativa (LECAA) és una aplicació web per practicar les bases del codi escrit en català. Inclou activitats de so inicial, rima, correspondència entre lletres i sons, lectura de paraules i construcció de paraules amb un teclat reduït. Les respostes es donen seleccionant: no cal respondre oralment. Es pot fer servir amb selecció directa, lector ocular o commutadors, segons la configuració d’accés.","LECAA és un recurs complementari. No és un mètode complet d’ensenyament de la lectura i l’escriptura ni substitueix la intervenció educativa, la lectura compartida, l’escriptura amb finalitats comunicatives o el treball de vocabulari i comprensió. A la Guia i Marc Teòric trobaràs els fonaments i les pràctiques que permeten situar-lo dins d’un ensenyament més ampli.","Els fonaments que es presenten a la guia provenen de dos àmbits: estudis amb persones que fan servir comunicació augmentativa i alternativa (CAA) i recerca amb altres poblacions. LECAA, com a aplicació, no compta amb evidència pròpia, però el seu disseny s’ha basat en tota l’evidència científica disponible en el moment de la seva creació.","L’aplicació s’ha creat des de la Unitat de Tècniques Augmentatives de Comunicació (UTAC), amb eines d’intel·ligència artificial. És també un exemple de com aquestes eines poden contribuir a crear recursos educatius accessibles. Les institucions, les eines utilitzades i les llicències es poden consultar als Crèdits."],"sections":[{"id":"comencar","title":"Com començar","intro":"Una orientació breu per preparar el perfil, comprovar l’accés i acompanyar les primeres sessions.","blocks":[{"type":"heading","text":"1. Prepara un perfil"},{"type":"p","text":"A la pantalla inicial, tria «Nou perfil». Les opcions i els registres de cada alumne es conserven en el seu perfil. Des del seu espai, entra a «Opcions avançades» per revisar l’accés, el pla de treball i els materials."},{"type":"heading","text":"2. Comprova com selecciona"},{"type":"p","text":"Configura el sistema d’accés que utilitza l’alumne i prova’l abans de començar: selecció directa, mirada amb temps de fixació, mirada amb commutador o encercament. Comprova que pot arribar a les opcions i activar-les de manera còmoda. En la configuració de mirada, el lector ocular ha de funcionar amb el programari d’accés del dispositiu."},{"type":"heading","text":"3. Personalitza la presentació i els materials"},{"type":"p","text":"A «Presentació» pots triar Senzilles, Detallades o ARASAAC; la lletra dels exercicis, majúscula o minúscula; i si el guia es mostra animat, estàtic o no es mostra. Revisa les paraules i les imatges del pla: pots excloure paraules o afegir fotografies pròpies. Els enunciats mantenen el seu format habitual."},{"type":"heading","text":"4. Prepara el pla i inicia la sessió"},{"type":"p","text":"Indica les lletres que l’alumne ja coneix i revisa les activitats activades. A «Lletra i so» es poden presentar dues, tres o quatre opcions. Ajusta les repeticions i les ajudes al seu ritme. Torna al resum del perfil i prem «Començar la sessió». Durant les activitats hi ha controls per repetir, demanar ajuda i fer una pausa."},{"type":"heading","text":"5. Revisa el progrés i conserva una còpia"},{"type":"p","text":"A «Com va?» pots consultar les sessions i les respostes. Els perfils i els materials personals es desen només en aquest navegador i dispositiu, també quan LECAA s’utilitza en línia. A «Còpies de seguretat», a la pantalla inicial, pots exportar tots els perfils o importar-los en un altre dispositiu; també pots exportar un perfil individual des de la seva configuració. Conserva el fitxer exportat en un lloc adequat."}]},{"id":"abast","title":"Objectius i abast","intro":"Una eina per practicar el codi escrit dins d’un ensenyament de la lectura i l’escriptura més ampli.","blocks":[{"type":"heading","text":"Què es practica"},{"type":"p","text":"LECAA ofereix cinc tipus d’activitat: So inicial, Rima, Lletra i so, Llegeix i tria i Construeix la paraula. El treball se centra en paraules i correspondències entre grafies i sons. Les activitats de construcció utilitzen un teclat reduït per formar la paraula proposada; no són activitats d’escriptura lliure."},{"type":"evidence","kind":"altres","title":"El codi escrit és una part de la lectura","paragraphs":["La recerca general sobre l’aprenentatge lector destaca la importància de l’ensenyament de les correspondències entre grafies i sons, però també del llenguatge, el vocabulari i la comprensió. Llegir paraules i comprendre textos són objectius relacionats que requereixen una intervenció més àmplia que la pràctica del codi ([[castles2018|Castles et al., 2018]]; [[hoover1990|Hoover & Gough, 1990]])."]},{"type":"heading","text":"Oportunitats d’aprendre i expectatives"},{"type":"evidence","kind":"caa","title":"Les barreres també són a l’entorn","paragraphs":["Les expectatives baixes, les demandes de resposta oral, la manca de materials accessibles i l’accés insuficient a professionals formats poden limitar les oportunitats d’aprendre de les persones que necessiten o fan servir CAA. La revisió de Light et al. situa aquestes barreres entre els problemes que cal abordar en l’ensenyament de l’alfabetització ([[light2025|Light et al., 2025]])."]},{"type":"p","text":"Fer servir CAA no defineix una única manera d’aprendre ni implica necessàriament absència de parla. Les característiques comunicatives, sensorials, motrius i lingüístiques dels participants varien entre estudis; per això cal observar cada alumne i evitar conclusions generals a partir de la seva forma de comunicació ([[collins2024|Collins et al., 2024]]; [[light2025|Light et al., 2025]])."},{"type":"heading","text":"El paper de l’adult"},{"type":"p","text":"Un enfocament comprensiu inclou oportunitats de llegir amb altres persones, explorar llibres, escriure, conversar i utilitzar la lectura i l’escriptura en situacions amb sentit. L’adult prepara aquestes oportunitats, ensenya, modela i adapta els materials. Aquesta és l’orientació educativa desenvolupada per Erickson i Koppenhaver, que defensa l’accés a l’alfabetització sense exigir prerequisits de parla o de rendiment previ ([[erickson2020|Erickson & Koppenhaver, 2020]])."},{"type":"p","text":"Oferir ensenyament a tothom no equival a garantir un mateix resultat per a tothom. Les dades d’intervenció amb persones que fan servir CAA mostren possibilitats d’aprenentatge, però també variabilitat i límits en la generalització dels resultats ([[ulriksen2026b|Ulriksen et al., 2026b]])."}]},{"id":"evidencia","title":"Fonaments i evidència","intro":"La guia diferencia els estudis amb persones que fan servir CAA de la recerca amb altres poblacions. Els resultats s’interpreten dins de l’abast de cada estudi.","blocks":[{"type":"evidence","kind":"caa","title":"Què mostra la recerca amb CAA","paragraphs":["Una revisió sistemàtica de set estudis de cas únic, amb 20 participants, va trobar resultats positius consistents en les correspondències entre lletres i sons. La descodificació va presentar resultats més variables. La base d’estudis és petita i se centra sobretot en habilitats inicials: no permet garantir l’aprenentatge de la lectura a qualsevol persona ni establir una durada òptima d’ensenyament ([[ulriksen2026b|Ulriksen et al., 2026b]]).","En un estudi amb l’aplicació Accessible Literacy Learning (ALL), quatre infants que feien servir CAA van millorar en les habilitats entrenades i tres van generalitzar la descodificació a paraules noves. La intervenció la van aplicar familiars formats; aquests resultats corresponen a ALL i a les condicions d’aquell estudi ([[babb2026|Babb & Caron, 2026]]).","En una intervenció fònica adaptada amb tres alumnes amb discapacitat intel·lectual que necessitaven CAA, tots tres van millorar en lectura i dos també en escriptura. La mostra reduïda obliga a ser prudents quan s’estenen els resultats a altres alumnes i contextos ([[linder2023|Linder et al., 2023]])."]},{"type":"evidence","kind":"altres","title":"Què aporta la recerca amb altres poblacions","paragraphs":["Els estudis sobre lectura en altres poblacions aporten informació sobre l’ensenyament explícit del codi, la consciència fonèmica, l’escriptura i la comprensió. Aporten fonaments rellevants, però no demostren per si mateixos l’eficàcia d’una intervenció concreta amb persones que fan servir CAA ([[castles2018|Castles et al., 2018]]).","En un estudi suec amb 123 alumnes amb discapacitat intel·lectual, distribuïts en quatre grups, només la intervenció multicomponent va mostrar una millora superior en consciència fonològica. No es van observar diferències entre els grups en reconeixement de paraules ni en comprensió. És una mostra de la necessitat de considerar tant els resultats positius com els que no confirmen els beneficis esperats ([[palmqvist2025|Palmqvist et al., 2025]]).","Un estudi prolongat amb alumnat amb discapacitat intel·lectual va observar progressos amb ensenyament intensiu i sistemàtic, amb diferències importants entre alumnes. Les seves dades no estableixen una dosi universal ni un calendari de progrés aplicable a tots els usuaris de CAA ([[allor2014|Allor et al., 2014]])."]},{"type":"heading","text":"Com s’han de llegir les conclusions"},{"type":"list","items":["Una millora en les paraules practicades no demostra, tota sola, lectura de paraules noves ni comprensió de textos.","Una associació entre dues habilitats no demostra que una sigui la causa de l’altra.","El resultat d’un grup o d’un estudi petit no determina el resultat d’un alumne concret.","Els estudis d’altres programes aporten fonaments; no són estudis d’eficàcia de LECAA."]},{"type":"p","text":"Aquestes precaucions són especialment rellevants davant l’heterogeneïtat de participants, procediments i mesures que descriuen les revisions d’intervenció i avaluació en CAA ([[collins2024|Collins et al., 2024]]; [[ulriksen2026b|Ulriksen et al., 2026b]])."}]},{"id":"activitats","title":"Activitats i suports","intro":"Els fonaments de les correspondències entre sons i grafies, la lectura de paraules, l’escriptura i els suports durant l’aprenentatge.","blocks":[{"type":"heading","text":"Correspondències entre grafies i sons"},{"type":"evidence","kind":"caa","title":"Una habilitat inicial amb resultats consistents","paragraphs":["L’ensenyament adaptat de les correspondències entre lletres i sons és el component amb resultats més consistents en la revisió d’intervencions inicials amb infants amb discapacitat intel·lectual que fan servir CAA ([[ulriksen2026b|Ulriksen et al., 2026b]])."]},{"type":"evidence","kind":"altres","title":"Ensenyament explícit del codi","paragraphs":["La recerca general ha trobat un paper causal del coneixement de les correspondències entre lletres i sons i de la consciència fonèmica en l’aprenentatge lector. Això dona suport a ensenyar i practicar aquestes relacions ([[hulme2012|Hulme et al., 2012]])."]},{"type":"heading","text":"Grafies, dígrafs i síl·labes"},{"type":"evidence","kind":"altres","title":"Resultats que provenen d’altres llengües i poblacions","paragraphs":["En un estudi amb aprenents de portuguès del Brasil, ensenyar les subunitats grafema–fonema va donar millors resultats que ensenyar síl·labes senceres en diverses mesures de lectura i escriptura. La població estudiada no utilitzava CAA ([[sargiani2022|Sargiani et al., 2022]]).","També s’han observat beneficis d’una intervenció fònica amb alumnat amb discapacitat intel·lectual. Aquesta recerca amplia el coneixement sobre l’ensenyament del codi, però no tots els seus participants o condicions són equivalents als dels estudis específics amb CAA ([[sermier2021|Sermier Dessemontet et al., 2021]])."]},{"type":"heading","text":"Ajuntar els sons i reconèixer la paraula"},{"type":"evidence","kind":"altres","title":"De la descodificació al reconeixement","paragraphs":["Els models d’aprenentatge lector descriuen com les connexions entre grafies, sons i significats contribueixen a fixar les paraules a la memòria. La descodificació participa en aquest procés, juntament amb el coneixement lingüístic ([[ehri2014|Ehri, 2014]]; [[share1995|Share, 1995]]).","Amb lectors principiants, la fonació connectada va resultar més eficaç que la segmentada per ensenyar a descodificar paraules desconegudes. Aquest estudi no es va fer amb usuaris de CAA. A més, escoltar enregistraments de sons separats no reprodueix automàticament la fonació connectada: els sons de les grafies poden variar segons el context de la paraula ([[gonzalez2021|Gonzalez-Frey & Ehri, 2021]])."]},{"type":"heading","text":"Consciència fonològica a prop de les lletres"},{"type":"evidence","kind":"altres","title":"Relació amb el codi escrit","paragraphs":["Una metaanàlisi va trobar que l’ensenyament de consciència fonèmica pot afavorir la lectura i que el treball amb lletres és una característica rellevant de les intervencions ([[ehri2001|Ehri et al., 2001]]). Una metaanàlisi posterior va examinar la relació entre quantitat d’ensenyament i resultats en consciència fonèmica amb infants de les primeres etapes escolars. Les seves estimacions no són un límit d’hores ni una pauta de tractament per a persones que fan servir CAA ([[erbeli2024|Erbeli et al., 2024]]).","En un estudi amb infants de preescolar, afegir prèviament ensenyament de consciència sil·làbica no va aportar un benefici addicional clar a la intervenció fonèmica. Aquest resultat no estableix una seqüència universal, però qüestiona que s’hagi d’exigir sempre el domini sil·làbic abans d’introduir el treball fonèmic ([[ukrainetz2011|Ukrainetz et al., 2011]])."]},{"type":"heading","text":"Respondre seleccionant"},{"type":"evidence","kind":"caa","title":"Mostrar coneixements sense exigir una resposta oral","paragraphs":["Els formats d’avaluació de coneixement escrit amb CAA inclouen diferents respostes per selecció. Cal comprovar què exigeix cada format i si les adaptacions permeten interpretar el rendiment de l’alumne ([[collins2024|Collins et al., 2024]])."]},{"type":"p","text":"A «Rima» es tria entre dues respostes. A «Lletra i so» el nombre d’opcions és configurable. Si totes les opcions fossin igualment probables i es triés a l’atzar, l’encert seria del 50% amb dues, aproximadament del 33% amb tres i del 25% amb quatre. Són probabilitats matemàtiques, no estimacions del comportament d’un alumne. Un encert aïllat no és suficient per establir domini."},{"type":"heading","text":"Interpretar les opcions incorrectes"},{"type":"evidence","kind":"caa","title":"Els errors donen informació, però necessiten context","paragraphs":["Les adaptacions descrites en la literatura inclouen la selecció acurada d’opcions incorrectes per explorar possibles dificultats. Una resposta pot ser compatible amb diverses explicacions: confusió de sons, reconeixement de la imatge o dificultat d’accés. L’anàlisi d’errors requereix observació i no equival a un diagnòstic ([[light2025|Light et al., 2025]])."]},{"type":"heading","text":"Escoltar, repetir i comprovar el vocabulari"},{"type":"evidence","kind":"caa","title":"Les demandes de memòria i el format importen","paragraphs":["Card i Dodd van trobar diferències entre tasques de consciència fonològica en infants amb paràlisi cerebral amb parla i sense parla. Els resultats van variar segons la demanda de la tasca i no permeten afirmar que totes les persones que no parlen tinguin les mateixes dificultats o no disposin de representacions fonològiques ([[card2006|Card & Dodd, 2006]])."]},{"type":"p","text":"LECAA permet tornar a escoltar els enunciats i presenta suport auditiu per a les paraules. Sentir el nom d’una imatge ajuda a aclarir quina paraula s’hi associa, però no comprova, tot sol, que l’alumne la comprengui. Convé explorar també el seu vocabulari i el reconeixement de les representacions; en alumnat amb discapacitat intel·lectual que utilitza CAA s’han observat associacions entre vocabulari i habilitats inicials de lectura, sense que això demostri causalitat ([[ulriksen2026a|Ulriksen et al., 2026a]])."},{"type":"heading","text":"Ajudes graduades i lectura amb suport"},{"type":"evidence","kind":"caa","title":"Distingir participació amb ajuda i rendiment independent","paragraphs":["Una intervenció de lectura compartida amb tecnologia de CAA va combinar temps d’espera, ajudes i modelatge amb suports de lectoescriptura. Va augmentar la participació dels infants en aquella activitat ([[holyfield2026|Holyfield et al., 2026]])."]},{"type":"evidence","kind":"altres","title":"Registrar l’ajuda també pot informar","paragraphs":["Un estudi d’intervenció en consciència fonològica amb persones amb síndrome de Down va utilitzar mesures que tenien en compte els suports. Aquest tipus d’informació pot complementar la distinció entre encert i error, dins dels procediments de l’estudi ([[hessling2022|Hessling Prahl et al., 2022]])."]},{"type":"p","text":"En revisar una sessió de LECAA, diferencia les respostes sense ajuda de les que s’han resolt amb pistes, reducció d’opcions o model. Si l’aplicació ha fet sonar la paraula, aquella resposta no mostra, tota sola, que l’alumne l’hagi descodificada independentment."},{"type":"heading","text":"Construir paraules i escriure"},{"type":"evidence","kind":"caa","title":"Formar paraules amb lletres","paragraphs":["Linder et al. van incloure adaptacions de lectura i escriptura en una intervenció fònica amb tres alumnes que necessitaven CAA. Dos van millorar també en escriptura. L’estudi dona suport a explorar aquestes habilitats amb formes de resposta accessibles ([[linder2023|Linder et al., 2023]])."]},{"type":"p","text":"A «Construeix la paraula», l’alumne selecciona lletres, pot esborrar, escoltar «El que he escrit» i confirmar amb «Fet». Aquesta pràctica d’una paraula proposada s’ha de distingir de l’escriptura generativa amb accés a tot l’alfabet, que forma part d’una proposta comprensiva d’alfabetització fora d’aquesta activitat ([[erickson2020|Erickson & Koppenhaver, 2020]])."},{"type":"heading","text":"Pràctica, repàs i continuïtat"},{"type":"evidence","kind":"altres","title":"Ensenyament sistemàtic i seguiment","paragraphs":["Les recomanacions basades en la recerca amb alumnat amb discapacitat intel·lectual inclouen ensenyament explícit i sistemàtic, repàs acumulatiu i decisions informades per dades. Aquests principis permeten organitzar la pràctica i revisar-ne els resultats ([[lemons2016|Lemons et al., 2016]])."]}]},{"id":"acces","title":"Accés i personalització","intro":"La manera de respondre ha de permetre observar l’aprenentatge sense confondre les dificultats d’accés amb els coneixements de lectura i escriptura.","blocks":[{"type":"evidence","kind":"caa","title":"Adaptar la resposta i interpretar bé l’avaluació","paragraphs":["La revisió de Collins et al. descriu una gran diversitat de procediments per mesurar el coneixement escrit en estudiants que fan servir CAA. L’accessibilitat de la resposta, les demandes de la prova i les adaptacions emprades són elements necessaris per interpretar-ne el resultat ([[collins2024|Collins et al., 2024]])."]},{"type":"table","head":["Què cal observar","Què es pot revisar"],"rows":[["Seleccions accidentals o dificultat per arribar a una opció","Posició, mida i funcionament del sistema d’accés; temps de fixació o d’encercament."],["L’ajuda apareix abans que l’alumne acabi de seleccionar","Temps d’espera, durada del recorregut i modalitat d’ajuda."],["Una imatge o una paraula no és familiar","Comprensió del vocabulari i adequació de la representació; materials personalitzats."],["Resultats diferents segons les ajudes disponibles","Si s’ha escoltat la paraula, s’han reduït opcions o s’ha mostrat un model."],["Canvis entre sessions","Condicions d’accés i participació, fatiga observada, ajudes i temps de treball real."]]},{"type":"p","text":"La taula és una pauta d’observació, no una prova estandarditzada ni una classificació de perfils. L’objectiu és revisar les condicions de resposta abans d’atribuir un error exclusivament a una dificultat lectora."},{"type":"heading","text":"Un accés diferent no defineix un nivell lector"},{"type":"p","text":"L’ús de mirada o de commutadors descriu com es respon. No s’ha de tractar automàticament com una pista pedagògica ni com una mesura del coneixement escrit. Alhora, els resultats d’un estudi només s’han d’estendre als sistemes d’accés que realment s’hi han estudiat; la revisió de les mesures en CAA mostra per què cal descriure aquestes condicions ([[collins2024|Collins et al., 2024]])."},{"type":"heading","text":"Opcions disponibles a LECAA"},{"type":"p","text":"Cada perfil permet configurar l’accés, la presentació, les veus, les repeticions i les ajudes, així com revisar els materials. Prova la configuració amb l’alumne i comprova la resposta real abans d’interpretar les dades de la sessió."},{"type":"heading","text":"Dades i còpies de seguretat"},{"type":"p","text":"Els perfils, el progrés, les fotografies i els àudios personalitzats es conserven en aquest navegador i dispositiu. LECAA no els envia a cap servidor. Obrir l’aplicació des d’un altre navegador o dispositiu no hi trasllada els perfils: cal exportar-los i importar-los. Esborrar les dades del navegador pot eliminar-los; la còpia de seguretat permet conservar-los i traslladar-los."}]},{"id":"mes-enlla","title":"Més enllà de LECAA","intro":"La lectura i l’escriptura han de tenir espai en les converses, els llibres, l’aula i la vida quotidiana, més enllà dels exercicis de paraules.","blocks":[{"type":"heading","text":"Lectura compartida amb accés a la CAA"},{"type":"evidence","kind":"caa","title":"Participar en la lectura","paragraphs":["En un estudi amb quatre infants que es trobaven en fases inicials de comunicació simbòlica, incorporar tecnologia de CAA amb suports de lectoescriptura va augmentar la participació en lectura compartida. El resultat es refereix a participació, no a una demostració general de descodificació o comprensió lectora ([[holyfield2026|Holyfield et al., 2026]])."]},{"type":"p","text":"Quan comparteixis un llibre, mantén el sistema de comunicació a l’abast, ofereix oportunitats de comentar i escollir, i deixa temps per respondre. La lectura compartida pot incloure tant el contingut del conte com les opinions i els interessos de l’alumne ([[erickson2020|Erickson & Koppenhaver, 2020]])."},{"type":"heading","text":"Modelatge amb el sistema de comunicació"},{"type":"evidence","kind":"caa","title":"Una pràctica estudiada per a la comunicació","paragraphs":["Les revisions de modelatge assistit amb CAA descriuen efectes positius en habilitats comunicatives. Es tracta de recerca sobre comunicació: no s’ha de presentar com una demostració directa que el modelatge, tot sol, ensenyi a llegir. En l’activitat quotidiana, l’adult pot parlar i utilitzar també els símbols del sistema de comunicació ([[biggs2018|Biggs et al., 2018]]; [[sennott2016|Sennott et al., 2016]])."]},{"type":"heading","text":"Escriptura amb accés a tot l’alfabet"},{"type":"p","text":"Una proposta comprensiva ofereix oportunitats d’escriptura amb un «llapis alternatiu»: teclat, alfabet amb encercament o plafó de lletres, segons l’accés de la persona. L’objectiu és poder explorar i expressar idees, també abans de l’escriptura convencional. Aquest treball es pot desenvolupar amb altres recursos i en els contextos quotidians de l’alumne ([[erickson2020|Erickson & Koppenhaver, 2020]])."},{"type":"heading","text":"Paraula escrita i sortida de veu al comunicador"},{"type":"evidence","kind":"caa","title":"Exposició a paraules en context comunicatiu","paragraphs":["Una funció de CAA que mostrava i feia sonar la paraula escrita després de seleccionar un símbol va produir millores en lectura de paraules en quatre participants amb autisme i parla mínima o nul·la. Aquesta funció és una de les vies estudiades per vincular l’ús comunicatiu dels símbols amb la paraula escrita ([[caron2021|Caron et al., 2021]])."]},{"type":"heading","text":"Vocabulari, llenguatge i comprensió"},{"type":"evidence","kind":"altres","title":"Llegir per entendre","paragraphs":["Els models de lectura destaquen la contribució de la descodificació i de la comprensió lingüística. El treball del codi s’ha d’integrar amb vocabulari, conversa i comprensió de textos; practicar correspondències o seleccionar una imatge no cobreix, per si sol, tots aquests components ([[castles2018|Castles et al., 2018]]; [[hoover1990|Hoover & Gough, 1990]])."]},{"type":"heading","text":"Usos amb sentit"},{"type":"p","text":"Els noms, els llibres d’interès, les llistes, les notes i les decisions quotidianes ofereixen contextos per llegir i escriure amb una finalitat. Aquesta orientació forma part de la proposta comprensiva d’alfabetització per a estudiants amb discapacitats significatives ([[erickson2020|Erickson & Koppenhaver, 2020]])."},{"type":"heading","text":"Formació i col·laboració dels adults"},{"type":"evidence","kind":"caa","title":"Ensenyar els procediments als qui acompanyen","paragraphs":["Després d’una formació en línia sobre ensenyament de correspondències entre lletres i sons, els professionals d’un estudi van millorar la fidelitat d’aplicació i vuit dels nou alumnes que feien servir CAA van millorar en aquestes correspondències. El resultat es refereix a aquell procediment de formació i intervenció ([[caron2022|Caron et al., 2022]]).","La recerca qualitativa amb famílies mostra experiències, prioritats i necessitats de suport diverses. Conèixer-les ajuda a situar la col·laboració entre família i professionals; un estudi qualitatiu no prova, per si mateix, l’eficàcia d’una aplicació ([[leroux2024|Leroux et al., 2024]])."]},{"type":"heading","text":"Continuïtat i temps real d’ensenyament"},{"type":"evidence","kind":"altres","title":"Registrar el que es fa realment","paragraphs":["En l’estudi de Palmqvist et al., la intervenció efectivament rebuda va ser inferior a la planificada. Per valorar resultats cal considerar les oportunitats reals de pràctica, i no només la durada prevista d’un programa ([[palmqvist2025|Palmqvist et al., 2025]]). Les dades de seguiment complementen l’observació del progrés al llarg del temps ([[lemons2016|Lemons et al., 2016]])."]}]},{"id":"llengues","title":"Adaptacions i altres llengües","intro":"Una adaptació lingüística ha de revisar els materials, les correspondències entre sons i grafies i les formes de resposta.","blocks":[{"type":"heading","text":"Aquesta versió és en català"},{"type":"p","text":"LECAA està disponible en català i castellà, però descarregant l’arxiu HTML, qui hi tingui interès, pot adaptar-lo a altres idiomes fent servir eines d’IA equivalents a les descrites als Crèdits."},{"type":"evidence","kind":"altres","title":"L’ortografia modifica les demandes d’aprenentatge","paragraphs":["En una comparació d’ortografies europees, l’adquisició inicial va presentar diferències importants entre llengües. Per tant, els resultats o les seqüències emprades en una ortografia no es poden traslladar mecànicament a una altra ([[seymour2003|Seymour et al., 2003]])."]},{"type":"heading","text":"Què cal revisar en una adaptació"},{"type":"list","items":["Les correspondències entre grafies i sons, els dígrafs i els canvis de pronunciació segons el context i la varietat lingüística.","Les paraules, les rimes i les opcions de resposta: han de correspondre a la llengua i no introduir més d’una resposta correcta.","El significat i la familiaritat de les imatges, amb les equivalències que calguin en cada comunitat lingüística.","Els enunciats i els àudios, contrastant-los amb persones competents en la llengua i la seva fonètica.","L’accés, les configuracions, els registres i les llicències dels materials incorporats."]},{"type":"p","text":"Aquesta és una pauta per revisar una adaptació, no una garantia d’equivalència ni d’eficàcia. Una nova versió necessita comprovar els seus propis materials i funcionament."}]},{"id":"limits","title":"Limitacions i seguiment","intro":"Els fonaments de la guia ajuden a interpretar el recurs, però no substitueixen l’avaluació de l’aplicació ni el seguiment de cada alumne.","blocks":[{"type":"heading","text":"LECAA no té estudis propis d’eficàcia"},{"type":"p","text":"No es disposa d’un estudi que estableixi l’eficàcia de LECAA, per a quins perfils és útil o quina intensitat d’ús necessita. LECAA tan sols s’ha basat en l’evidència disponible per dissenyar el programa."},{"type":"evidence","kind":"caa","title":"Abast de les dades disponibles","paragraphs":["La recerca d’intervenció amb persones que fan servir CAA encara té mostres petites i mesures centrades sobretot en habilitats inicials. Els resultats són prometedors en alguns components i més variables en d’altres, amb límits per generalitzar a nous participants, materials i sistemes d’accés ([[ulriksen2026b|Ulriksen et al., 2026b]])."]},{"type":"evidence","kind":"altres","title":"Prudència en les extrapolacions","paragraphs":["Els estudis amb altres poblacions o llengües aporten fonaments, però no permeten assumir el mateix resultat ni una dosi òptima per a cada usuari de CAA. Les estimacions sobre hores d’ensenyament o les comparacions entre enfocaments s’han de mantenir dins de la població i les mesures estudiades ([[erbeli2024|Erbeli et al., 2024]]; [[sargiani2022|Sargiani et al., 2022]])."]},{"type":"heading","text":"Àudios, imatges i contingut"},{"type":"p","text":"Les locucions s’han generat amb veus d’ElevenLabs; no són enregistraments humans que disposin, per aquest fet, de validació fonètica professional. Els sons aïllats i les seqüències de sons són suports de pràctica i no sempre equivalen a la pronunciació contextual d’una paraula. Les imatges tampoc no garanteixen la comprensió del vocabulari."},{"type":"heading","text":"Els registres són informació de pràctica"},{"type":"p","text":"Els gràfics i els registres de LECAA descriuen el que s’ha fet a l’aplicació. No són una prova estandarditzada, un diagnòstic ni una avaluació completa de la comprensió lectora. Interpreta’ls juntament amb l’observació, l’accés, les ajudes i les oportunitats d’ús real de la lectura i l’escriptura ([[collins2024|Collins et al., 2024]]; [[lemons2016|Lemons et al., 2016]])."},{"type":"heading","text":"Preguntes per al seguiment"},{"type":"list","items":["Què resol l’alumne sense ajuda i què resol amb suport?","El canvi es manté en sessions diferents i amb materials nous?","L’accés i la familiaritat de les imatges permeten interpretar la resposta?","L’aprenentatge també es mostra en altres activitats i contextos?"]},{"type":"p","text":"Les referències següents permeten consultar les fonts de la guia. Els DOI s’ofereixen com a enllaços permanents quan estan disponibles; la lectura de la guia i les seves il·lustracions funciona sense connexió, però obrir les fonts externes requereix Internet."}]}],"references":[{"id":"allor2014","authors":"Allor, J. H., Mathes, P. G., Roberts, J. K., Cheatham, J. P., & Al Otaiba, S.","year":"2014","title":"Is scientifically based reading instruction effective for students with below-average IQs?","journal":"Exceptional Children","publication":"80(3), 287–306","doi":"10.1177/0014402914522208","url":"https://doi.org/10.1177/0014402914522208"},{"id":"babb2026","authors":"Babb, S., & Caron, J. G.","year":"2026","title":"Effects of instruction with the Accessible Literacy Learning app on three literacy skills for children who use augmentative and alternative communication","journal":"American Journal of Speech-Language Pathology","publication":"35(2), 431–447","doi":"10.1044/2025_ajslp-25-00218","url":"https://doi.org/10.1044/2025_ajslp-25-00218"},{"id":"biggs2018","authors":"Biggs, E. E., Carter, E. W., & Gilson, C. B.","year":"2018","title":"Systematic review of interventions involving aided AAC modeling for children with complex communication needs","journal":"American Journal on Intellectual and Developmental Disabilities","publication":"123(5), 443–473","doi":"10.1352/1944-7558-123.5.443","url":"
